<div class="proveedor-card">
  <div class="proveedor-info">
    <h3 class="proveedor-nombre">{{ proveedor.NombreProveedor }}</h3>
    <div class="proveedor-meta">
      <span>{{ proveedor.EmailProveedor }}</span>
      <span style="color: var(--soft-pink)">•</span>
      <span>{{ proveedor.TelefonoProveedor }}</span>
    </div>
  </div>

  <div class="proveedor-id">
    ID-{{ proveedor.IdProveedor }}
  </div>
</div>
