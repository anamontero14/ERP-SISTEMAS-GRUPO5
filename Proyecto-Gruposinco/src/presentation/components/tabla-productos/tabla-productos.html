<table class="tabla">
  <thead>
    <tr>
      <th>ID Producto</th>
      <th>Cantidad</th>
      <th>Precio Unitario</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let d of detalles">
      <td>{{ d.IdProducto }}</td>
      <td>{{ d.Cantidad }}</td>
      <td>{{ d.PrecioUnitario }} €</td>
      <td>{{ d.Cantidad * d.PrecioUnitario }} €</td>
    </tr>
  </tbody>
</table>
