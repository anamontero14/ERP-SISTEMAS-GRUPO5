<div *ngIf="pedido as p">

  <h2>Actualizar pedido #{{ p.IdPedido }}</h2>

  <label>Proveedor:</label>
  <input 
    type="number" 
    [(ngModel)]="p.IdProveedor"
    [readonly]="!puedeEditar()"
  >

  <label>Observaciones:</label>
  <textarea 
    [(ngModel)]="p.Observaciones"
    [readonly]="!puedeEditar()"
  ></textarea>

  <label>Estado:</label>
  <select 
    [(ngModel)]="p.Estado"
    [disabled]="!puedeEditar()"
  >
    <option value="pedido">Pedido</option>
    <option value="en preparación">En preparación</option>
    <option value="entregado">Entregado</option>
  </select>

  <hr>

  <h3>Detalles del pedido</h3>

  <table>
    <tr>
      <th>ID Producto</th>
      <th>Cantidad</th>
      <th>Precio unitario</th>
    </tr>

    <tr *ngFor="let d of detalles">
      <td>{{ d.IdProducto }}</td>

      <td>
        <input 
          type="number" 
          [(ngModel)]="d.Cantidad"
          [readonly]="!puedeEditar()"
        >
      </td>

      <td>
        <input 
          type="number" 
          [(ngModel)]="d.PrecioUnitario"
          [readonly]="!puedeEditar()"
        >
      </td>
    </tr>
  </table>

  <button 
    (click)="guardar()" 
    [disabled]="!puedeEditar()"
  >
    Guardar cambios
  </button>

</div>
