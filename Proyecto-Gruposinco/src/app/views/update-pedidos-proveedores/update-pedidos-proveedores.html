<h2>Actualizar pedido</h2>

<div *ngIf="vm.loading()">Cargando...</div>

<div *ngIf="!vm.loading() && vm.pedido() as p">

  <h3>Detalles del pedido</h3>

  <!-- Mensaje si el pedido está archivado -->
  <div *ngIf="p.Archivado" style="color: red; font-weight: bold; margin-bottom: 10px;">
    Este pedido ya está archivado
  </div>

  <table>
    <tr>
      <th>Producto</th>
      <th>Cantidad</th>
      <th>Precio</th>
      <th>Eliminar pedido</th>
    </tr>

    <tr *ngFor="let d of vm.detalles(); let i = index">
      <td>{{ d.IdProducto }}</td>

      <td>
        <input type="number" [(ngModel)]="d.Cantidad" min="1">
      </td>

      <td>
        <input type="number" [ngModel]="d.PrecioUnitario" readonly>
      </td>

      <td>
        <!-- Botón solo si NO está archivado -->
        <button 
          *ngIf="!p.Archivado"
          (click)="eliminar(i)">
          Eliminar pedido
        </button>

        <!-- Texto si está archivado -->
        <span *ngIf="p.Archivado" style="color: gray;">
          Archivado
        </span>
      </td>

    </tr>
  </table>

  <button (click)="guardar()" [disabled]="vm.saving()">Guardar cambios</button>

</div>
