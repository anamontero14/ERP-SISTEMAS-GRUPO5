<h2>Actualizar pedido</h2>

<div *ngIf="vm.loading()">Cargando...</div>

<div *ngIf="!vm.loading() && vm.pedido() as p">

  <h3>Detalles del pedido</h3>

  <table>
    <tr>
      <th>Producto</th>
      <th>Cantidad</th>
      <th>Precio</th>
      <th>Eliminar pedido</th>
    </tr>

    <tr *ngFor="let d of vm.detalles(); let i = index">
      <td>{{ d.IdProducto }}</td>

      <td>
        <input type="number" [(ngModel)]="d.Cantidad" min="1">
      </td>

      <td>
        <input type="number" [ngModel]="d.PrecioUnitario" readonly>
      </td>

      <td>
        <button 
          *ngIf="!p.Archivado"
          (click)="eliminar(i)">
          Eliminar pedidos
        </button>
      </td>

    </tr>
  </table>

  <button (click)="guardar()" [disabled]="vm.saving()">Guardar cambios</button>

</div>
