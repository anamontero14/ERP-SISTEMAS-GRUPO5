<div class="list-page-container fade-in">

  <header class="list-header">
    <div class="titulo-wrapper">
      <h2 class="titulo-pagina">Pedidos Archivados</h2>
      <div class="subrayado-artístico"></div>
    </div>

    <div *ngIf="vm.loading()" class="loading-state">
      <div class="mini-spinner"></div> Cargando historial...
    </div>

    <div *ngIf="!vm.loading() && vm.archivados().length === 0 && !vm.error()" class="empty-state">
      No hay pedidos en el archivo.
    </div>
  </header>

  <div *ngIf="vm.error()" class="error-banner">
    <span>⚠️</span>
    <div>
      <strong>Error del servidor</strong>
      <p>{{ vm.error() }}</p>
    </div>
    <button class="btn-retry" (click)="vm.cargarArchivados()">Reintentar</button>
  </div>

  <div class="items-wrapper" *ngIf="!vm.loading() && !vm.error()">
    <app-pedido-item
      *ngFor="let p of vm.archivados()"
      [pedido]="p">
    </app-pedido-item>
  </div>

</div>
