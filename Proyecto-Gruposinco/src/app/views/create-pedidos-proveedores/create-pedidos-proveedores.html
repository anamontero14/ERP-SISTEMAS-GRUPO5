<div class="list-page-container fade-in">

  <header class="list-header">
    <div class="titulo-wrapper">
      <h2 class="titulo-pagina">Crear Nuevo Pedido</h2>
      <div class="subrayado-artístico"></div>
    </div>
  </header>

  <div class="form-container">
    <section class="form-section">
      <div class="input-group">
        <label>Seleccionar Proveedor</label>
        <select class="custom-select" [(ngModel)]="idProveedor">
          <option value="">Seleccione un proveedor...</option>
          <option *ngFor="let p of vm.proveedores()" [ngValue]="p.IdProveedor">
            {{ p.NombreProveedor }}
          </option>
        </select>
      </div>
    </section>

    <section class="form-section highlight">
      <h3>Añadir productos</h3>
      <div class="add-product-grid">
        <div class="input-group">
          <select class="custom-select" [(ngModel)]="idProducto">
            <option value="">Seleccione producto...</option>
            <option *ngFor="let prod of vm.productos()" [ngValue]="prod.IdProducto">
              {{ prod.NombreProducto }}
            </option>
          </select>
        </div>
        <div class="input-group qty">
          <input type="number" class="custom-input" [(ngModel)]="cantidad" min="1" placeholder="Cant.">
        </div>
        <button class="btn-add" (click)="agregar()">+</button>
      </div>
    </section>

    <section class="form-section table-section" *ngIf="vm.detalles().length > 0">
      <h3>Detalles añadidos</h3>
      <div class="table-wrapper">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Precio</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let d of vm.detalles(); let i = index">
              <td><span class="id-badge">#{{ d.IdProducto }}</span></td>
              <td><strong>{{ d.Cantidad }}</strong></td>
              <td>{{ d.PrecioUnitario }} €</td>
              <td>
                <button class="btn-delete" (click)="vm.eliminarDetalle(i)">×</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="form-section">
      <div class="input-group">
        <label>Observaciones del pedido</label>
        <textarea class="custom-textarea" [(ngModel)]="observaciones" placeholder="Notas adicionales..."></textarea>
      </div>

      <br>

      <div class="action-bar">
        <button class="btn-final" (click)="crear()" [disabled]="vm.saving() || !idProveedor">
          <span *ngIf="!vm.saving()">Confirmar y Crear Pedido</span>
          <span *ngIf="vm.saving()">Procesando...</span>
        </button>
      </div>
    </section>
  </div>
</div>
