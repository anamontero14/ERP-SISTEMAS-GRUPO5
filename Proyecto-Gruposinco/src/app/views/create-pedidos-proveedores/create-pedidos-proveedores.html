<h2>Crear pedido</h2>

<label>Proveedor:</label>
<select [(ngModel)]="idProveedor">
  <option value="">Seleccione proveedor</option>
  <option *ngFor="let p of vm.proveedores()" [ngValue]="p.IdProveedor">
    {{ p.NombreProveedor }}
  </option>
</select>

<hr>

<h3>Añadir productos</h3>

<select [(ngModel)]="idProducto">
  <option value="">Seleccione producto</option>
  <option *ngFor="let prod of vm.productos()" [ngValue]="prod.IdProducto">
    {{ prod.NombreProducto }}
  </option>
</select>

<input type="number" [(ngModel)]="cantidad" min="1">

<button (click)="agregar()">Añadir</button>

<hr>

<h3>Detalles añadidos</h3>

<table>
  <tr>
    <th>Producto</th>
    <th>Cantidad</th>
    <th>Precio</th>
    <th></th>
  </tr>

  <tr *ngFor="let d of vm.detalles(); let i = index">
    <td>{{ d.IdProducto }}</td>
    <td>{{ d.Cantidad }}</td>
    <td>{{ d.PrecioUnitario }}</td>
    <td><button (click)="vm.eliminarDetalle(i)">X</button></td>
  </tr>
</table>

<hr>

<label>Observaciones:</label>
<textarea [(ngModel)]="observaciones"></textarea>

<button (click)="crear()" [disabled]="vm.saving()">Crear pedido</button>
