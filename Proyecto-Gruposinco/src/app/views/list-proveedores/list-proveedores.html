<div class="list-page-container fade-in">

  <header class="list-header">
    <div class="titulo-wrapper">
      <h2 class="titulo-pagina">Proveedores</h2>
      <div class="subrayado-artístico"></div>
    </div>
    <div *ngIf="vm.loading()" class="loading-state">
      <div class="mini-spinner"></div> Cargando...
    </div>
  </header>

  <div *ngIf="vm.error()" class="error-banner">
    <span>⚠️</span>
    <div>
      <strong>Error del servidor</strong>
      <p>{{ vm.error() }}</p>
    </div>
    <button class="btn-retry" (click)="vm.cargarProveedores()">Reintentar</button>
  </div>

  <div class="items-wrapper" *ngIf="!vm.loading() && !vm.error()">
    <app-proveedor-item
      *ngFor="let p of vm.proveedores()"
      [proveedor]="p">
    </app-proveedor-item>
  </div>

</div>
